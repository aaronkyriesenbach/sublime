# NVIDIA GPU override for the whisper sidecar. Layer it on the base file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     --profile whisper up -d
# Needs the NVIDIA Container Toolkit on the host; see docs/whisper.md.
# Sublime's own service and config.yaml do not change.
services:
  whisper-models:
    command:
      - |
        set -e
        [ -f ggml-large-v3-turbo.bin ] || curl -fL -o ggml-large-v3-turbo.bin \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/ggml-large-v3-turbo.bin
      - --suppress-nst
      - -nlp
    devices:
      - nvidia.com/gpu=all
