# Example Sublime config. Mount this (or your own copy) at /config/config.yaml.
# See CONTEXT.md for the full domain vocabulary (Library, Strip, etc.).

libraries:
  - name: movies
    path: /media/movies
    languages: [en]
    # strip_scope: all   # default; "per_language" strips only Sublime-managed languages

  - name: tv
    path: /media/tv
    languages: [en, pt-BR]

# Provider secrets are never set here — pass them as environment variables:
#   SUBLIME_OPENSUBTITLES_API_KEY
#   SUBLIME_OPENSUBTITLES_USERNAME
#   SUBLIME_OPENSUBTITLES_PASSWORD
#   SUBLIME_SUBDL_API_KEY

providers:
  # chain is the ordered Provider Chain: a list of Tiers, highest-priority
  # first, tried in order until one succeeds. Defaults to a single
  # opensubtitles Tier if omitted.
  #
  # A bare name is its own one-member Tier (today's flat behavior):
  #   chain: [opensubtitles, subdl]
  #
  # A nested list is one Tier of Providers the operator trusts equally
  # (see CONTEXT.md's Tier entry and docs/adr/0008-tiered-provider-chain.md):
  chain: [[opensubtitles, subdl]]
  #
  # Capacity, like Suspension, never crosses a Tier. When every worker of a
  # Tier's Providers is busy, pairs wait (stay Pending) instead of falling to
  # the next Tier; only a Tier-mate with a free worker may take the work (see
  # docs/adr/0015-capacity-never-crosses-a-tier.md). So
  # [opensubtitles, subdl] does not spill to SubDL while OpenSubtitles is busy;
  # use [[opensubtitles, subdl]] if you want that overflow.
  #
  # whisper generates a subtitle from the video's own audio (same language
  # only, never Synced) and takes its place in the chain like any other
  # Provider: [whisper] alone, [whisper, opensubtitles] to prefer generated
  # subtitles, or [opensubtitles, whisper] as a last resort. The four setups:
  #
  #   chain: [whisper]                   # whisper only; no online account needed
  #   chain: [whisper, opensubtitles]    # prefer generated; fall back online
  #   chain: [opensubtitles, whisper]    # prefer online; generate as last resort
  #   chain: [[whisper, opensubtitles]]  # shared Tier: equally trusted
  #
  # Order is priority. Suspension (sidecar down, quota) and capacity (whisper's
  # single worker busy) never move a pair to the next Tier, so in
  # [whisper, opensubtitles] pairs wait for whisper; only a shared Tier lets
  # the other Provider substitute. Whisper never translates (audio must be in
  # the target language) and its subtitles are never Synced. Changing the chain
  # does not rewrite existing subtitles: run `sublime reprocess` to redo them.
  # Sidecar setup, models, GPU images and measured speed: docs/whisper.md.

  opensubtitles:
    worker_count: 4 # concurrent workers in this Provider's pool

  subdl:
    worker_count: 2
    paid: true # use SubDL's paid tier

  # Only needed when whisper is in the chain. No secrets: just the URL of a
  # whisper.cpp server. The compose example's sidecar is reachable at
  # http://whisper:8080 (start it with `docker compose --profile whisper up -d`).
  # whisper:
  #   endpoint: http://whisper:8080 # required
  #   worker_count: 1 # default; the sidecar serves one request at a time
  #   chunk_length: 10m # default; audio is transcribed in chunks about this
  #   long, cut at silence. Each request gets 3 x the chunk's audio length + 1
  #   minute. Keep the default; on a slow CPU pick a smaller model instead.
  #   Must be positive.
